name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  MPLBACKEND: Agg

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --extra dev --python ${{ matrix.python-version }}
      - name: No-mock check
        run: |
          if grep -rn "unittest\.mock\|MagicMock\|from mock import\|@patch" alf/tests/ --include="*.py" | grep -v "^#"; then
            echo "::error::unittest.mock usage detected in tests"
            exit 1
          fi
      - name: Pytest
        run: uv run --no-sync --python ${{ matrix.python-version }} pytest alf/tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --extra dev
      - name: Ruff check
        run: uv run --no-sync ruff check alf/
      - name: Ruff format check
        if: always()
        run: uv run --no-sync ruff format --check alf/
