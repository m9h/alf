[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alf-aif"
version = "0.1.0"
description = "Active inference/Learning Framework — standalone JAX-native active inference"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Morgan Hough"},
]
keywords = ["active-inference", "free-energy-principle", "jax", "bayesian", "POMDP"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.5.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
pymdp = ["inferactively-pymdp>=1.0.5"]
learning = ["optax>=0.2.4"]
metacognition = ["numpyro>=0.19.0", "scipy>=1.15"]
ddm = ["scipy>=1.15", "numpyro>=0.19.0"]
normative = ["scipy>=1.15"]
all = ["alf-aif[pymdp,learning,metacognition,ddm,normative]"]
test = ["pytest>=8.4", "pytest-xdist>=3.8", "scipy>=1.15"]
dev = ["alf-aif[all,test]", "ruff==0.17.4", "mypy>=1.15"]

[project.urls]
Homepage = "https://github.com/m9h/alf"
Repository = "https://github.com/m9h/alf"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["alf*"]
exclude = ["alf.tests*"]

[tool.pytest.ini_options]
testpaths = ["alf/tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"
